[project]
name = "backend-prefect"
version = "0.1.0"
description = "Step-Up 2FA (TOTP) backend orchestrated with Prefect"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.1",
    "fastapi>=0.115",
    "prefect>=3,<4",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "qrcode>=7.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
