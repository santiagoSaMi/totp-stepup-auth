[project]
name = "backend-prefect"
version = "0.1.0"
description = "Step-Up 2FA (TOTP) backend orchestrated with Prefect"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.1",
    "fastapi>=0.115",
    "prefect>=3,<4",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "qrcode>=7.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only `app` is Python code; web/ and sql/ sit next to it and must not be packaged.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
