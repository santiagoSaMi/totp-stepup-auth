[project]
name = "backend-prefect"
version = "0.1.0"
description = "Step-Up 2FA (TOTP) backend orchestrated with Prefect"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
